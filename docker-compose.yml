services:
  app:
    build: .
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      PORT: 3000
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

  verify:
    build: .
    depends_on:
      app:
        condition: service_healthy
    environment:
      APP_BASE_URL: http://app:3000
    command: ["node", "scripts/verify.js"]
    restart: "no"
